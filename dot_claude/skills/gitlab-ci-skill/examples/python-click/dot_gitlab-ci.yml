# GitLab CI for a Click-style Python project. Generated by the skill from a
# fresh clone of pallets/click on 2026-05-22, with no .gitlab-ci.yml as input.
#
# Patterns to notice (the skill applies these by default; they're what makes the
# YAML "idiomatic GitLab" rather than the lowest-common-denominator shape):
#
# - `.tox` hidden job with `extends:` reuse across 4 callers (lint, test,
#   typing, docs). Beats copy-pasting `uv tool install tox --with tox-uv` four
#   times.
# - Schedule-gated full matrix: `test` runs Python 3.13 on every push; the full
#   3.10-3.14 matrix lives on `test-matrix` and only fires when
#   $CI_PIPELINE_SOURCE == "schedule". Keeps every-push pipelines fast, nightly
#   schedules exercise the full grid.
# - `needs: []` on every test-stage job so they start as soon as the pipeline
#   begins, in parallel with `build`. The DAG (not stage order) drives execution.
# - `workflow:rules:` blocks the duplicate branch + MR pipeline once an MR opens.
# - Lockfile-keyed cache (`files: [uv.lock]`) keeps cache hits real.
# - `deploy` is a stub gated to tags and default-branch, both manual. Honest
#   about what it doesn't know yet; you wire the actual publish step.

default:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  interruptible: true
  cache:
    key:
      files: [uv.lock]
    paths:
      - .cache/uv/
      - .tox/
  before_script:
    - export UV_CACHE_DIR=.cache/uv

variables:
  UV_LINK_MODE: copy
  FORCE_COLOR: "1"
  PY_COLORS: "1"

# Skip duplicate branch + MR pipelines once an MR is open.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - build
  - test
  - deploy

# Reusable base for tox jobs: installs tox + tox-uv once, then runs the env.
.tox:
  before_script:
    - export UV_CACHE_DIR=.cache/uv
    - uv tool install tox --with tox-uv

# Build wheel and sdist with uv (flit backend driven via PEP 517).
build:
  stage: build
  script:
    - uv build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

lint:
  stage: test
  extends: .tox
  script:
    - uv tool run --from tox tox -e style
  needs: []

# Single Python version on every push. Scheduled pipelines exercise the full matrix (see test-matrix).
test:
  stage: test
  extends: .tox
  script:
    - uv tool run --from tox tox -e py3.13 -- --junitxml=report.xml
  artifacts:
    reports:
      junit: report.xml
    when: always
  needs: []

# Fan out across supported Python versions. Runs on scheduled pipelines only.
test-matrix:
  stage: test
  extends: .tox
  image: ghcr.io/astral-sh/uv:python$PY_VERSION-bookworm-slim
  script:
    - uv tool run --from tox tox -e py$PY_VERSION -- --junitxml=report.xml
  artifacts:
    reports:
      junit: report.xml
    when: always
  needs: []
  parallel:
    matrix:
      - PY_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

typing:
  stage: test
  extends: .tox
  script:
    - uv tool run --from tox tox -e typing
  needs: []

docs:
  stage: test
  extends: .tox
  script:
    - uv tool run --from tox tox -e docs
  artifacts:
    paths: [docs/_build/dirhtml/]
    expire_in: 1 week
  needs: []

# Stub. Replace with twine/uv publish to PyPI gated on $CI_COMMIT_TAG when ready.
deploy:
  stage: deploy
  script:
    - echo "Configure your deploy target. See https://docs.gitlab.com/ci/environments/"
  needs: [build]
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
