# GitLab CI pipeline for the cors Node.js library.
# Stages: build (npm pack), test (lint + mocha/nyc), deploy (manual stub).

default:
  image: node:lts-alpine
  interruptible: true
  # No committed lockfile in this project, so cache keys on package.json and
  # we use `npm install` (npm ci requires a tracked package-lock.json).
  cache:
    key:
      files: [package.json]
    paths: [.npm/]
  before_script:
    - npm install --cache .npm --prefer-offline --no-audit --no-fund

stages:
  - build
  - test
  - deploy

# Package the library as a publishable tarball.
build:
  stage: build
  script:
    - npm pack
  artifacts:
    paths: ["*.tgz"]
    expire_in: 1 week

# Static analysis with eslint.
lint:
  stage: test
  script: [npm run lint]
  needs: []

# Mocha test suite with nyc coverage.
unit-test:
  stage: test
  script: [npm run test-ci]
  needs: []
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    paths: [coverage/]
    expire_in: 1 week

# Stub: replace with `npm publish` (gated on $CI_COMMIT_TAG) once NPM_TOKEN is set
# as a masked, protected CI/CD variable. See docs.gitlab.com/ci/variables/.
deploy:
  stage: deploy
  script:
    - echo "Configure deploy. For npm publish, gate on \$CI_COMMIT_TAG and set NPM_TOKEN."
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
